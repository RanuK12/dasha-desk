<body>
<a class="bb-skip" href="#items">Skip to bounties</a>
<div id="bb-app" class="bb">
  <nav class="bb-nav" aria-label="Dasha">
    <a class="bb-brand" href="https://www.getdasha.com/">$<span>DASHA</span></a>
    <a href="https://www.getdasha.com/">Home</a>
    <a href="https://www.getdasha.com/lobby">Lobby</a>
    <a href="https://www.getdasha.com/bounties" aria-current="page">Bounties</a>
    <a href="https://www.getdasha.com/how-to-buy">Buy</a>
    <a href="https://x.com/dash_eats" target="_blank" rel="noopener noreferrer">@dash_eats</a>
  </nav>

  <div class="bb-shell">
    <div id="bb-banner" class="bb-banner bad" hidden></div>
    <noscript><p class="bb-banner warn">Need JS. <a href="./feed.json">feed.json</a> still works.</p></noscript>

    <header class="bb-head">
      <h1>Bounties</h1>
      <div class="bb-id" id="bb-id">
        <button type="button" class="bb-id-btn" id="bb-github" aria-label="GitHub">GitHub…</button>
        <a hidden href="https://lobby.getdasha.com/oauth/github/start">GitHub</a>
        <button type="button" class="bb-id-btn bb-id-x" id="bb-x" aria-label="X (optional)">X <span class="bb-id-badge">optional</span></button>
        <a hidden href="https://lobby.getdasha.com/oauth/x/start">X</a>
      </div>
    </header>

    <div class="bb-filters" id="bb-filters" hidden>
      <button type="button" class="bb-chip" data-filter="open" aria-pressed="false">Open</button>
      <button type="button" class="bb-chip" data-filter="paid" aria-pressed="false">Paid</button>
    </div>

    <section id="items" aria-label="Bounties">
      <div id="bb-hunt"></div>
    </section>

    <p id="bb-toast" class="bb-toast" role="status" aria-live="polite"></p>

    <section class="bb-list" id="list" aria-labelledby="bb-list-title">
      <h2 id="bb-list-title">List a bounty</h2>
      <form class="bb-form" id="bb-form" action="https://github.com/Uuriko/dasha-desk/issues/new" method="get">
        <input type="hidden" name="template" value="bounty-project.yml"/>
        <label class="bb-label" for="bb-item">GitHub URL</label>
        <input class="bb-input" id="bb-item" name="itemUrl" type="url" spellcheck="false" autocomplete="off" placeholder="https://github.com/owner/name" inputmode="url"/>
        <label class="bb-label" for="bb-amount">USDC</label>
        <input class="bb-input" id="bb-amount" name="amount" type="number" inputmode="decimal" step="any" min="0" placeholder="25" required/>
        <label class="bb-label" for="bb-payto">Pay to</label>
        <input class="bb-input" id="bb-payto" name="payTo" type="text" spellcheck="false" autocomplete="off" placeholder="Solana address" required/>
        <p class="bb-error" id="bb-form-error" role="alert" hidden></p>
        <div class="bb-actions">
          <button type="submit" class="bb-btn bb-btn-primary" id="bb-list">List</button>
          <button type="button" class="bb-btn" id="bb-save-local">Save</button>
          <a class="bb-btn" id="bb-issue-preview" hidden target="_blank" rel="noopener noreferrer">Preview GitHub issue</a>
        </div>
      </form>
    </section>
  </div>

  <footer class="bb-foot">We don't hold it.</footer>
</div>
<script src="./board.js"></script>
</body>
</html>
