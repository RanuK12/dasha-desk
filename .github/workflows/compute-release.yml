name: Compute release

on:
  pull_request:
    paths:
      - "compute/**"
      - ".github/workflows/compute-release.yml"
  push:
    branches: [main]
    paths:
      - "compute/**"
      - ".github/workflows/compute-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Protocol and release tests
        working-directory: compute
        run: npm test
      - name: Build deterministic archive
        working-directory: compute
        run: npm run release:build
      - name: Verify archive checksum
        working-directory: compute/dist
        run: sha256sum --check dasha-compute-open-alpha.tar.gz.sha256
      - name: Upload release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dasha-compute-open-alpha-${{ github.sha }}
          path: |
            compute/dist/dasha-compute-open-alpha.tar.gz
            compute/dist/dasha-compute-open-alpha.tar.gz.sha256
            compute/dist/release.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest main-branch archive provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: compute/dist/dasha-compute-open-alpha.tar.gz
      - name: Publish release assets on main (no binaries committed to git)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="compute-${GITHUB_SHA::8}"
          SHA256=$(cut -d' ' -f1 compute/dist/dasha-compute-open-alpha.tar.gz.sha256)
          NOTES="Deterministic compute release built from ${GITHUB_SHA}.
          SHA256 (dasha-compute-open-alpha.tar.gz): ${SHA256}
          Attested with actions/attest (SLSA); workflow artifact retained 30 days."
          FILES="compute/dist/dasha-compute-open-alpha.tar.gz compute/dist/dasha-compute-open-alpha.tar.gz.sha256 compute/dist/release.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" --title "Compute release ${GITHUB_SHA::8}" --notes "$NOTES" --latest=false $FILES
          fi
